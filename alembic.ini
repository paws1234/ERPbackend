# T-8.MIG.01 — the schema evolves by migration from Phase 8 on.
#
# The path is stated relative to this file (`%(here)s`), so the CLI and the application
# resolve the same tree whichever directory they are run from. The database URL is
# deliberately **not** stated here: `migrations/env.py` reads it from the application's
# own configuration (`app/config.py`), so `alembic upgrade head` and the process it
# migrates for cannot be pointed at two different databases. `alembic -x` is not needed
# to choose one — `DATABASE_URL` does.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
# One directory per version separator; the platform has one migration tree, not one per
# database engine.
version_path_separator = os
sqlalchemy.url =

# The application's own logger is configured by `app/observability.py`; Alembic is told
# to say little here, so a migration does not print a page of SQLAlchemy chatter into the
# install log an operator is reading (`python -m app.bootstrap` runs this tree).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
