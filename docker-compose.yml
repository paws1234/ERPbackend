# T-0.DEPLOY.03 — the stack: database, backend, worker and frontend as four containers.
#
# T-8.WORK.01 added the fourth: the **worker**, the same image as the backend with a
# different command (`python -m app.worker`), which runs the scheduled work — the session
# purge and the outbound-delivery retry (`app/schedule.py`) — on `pgqueuer`, Postgres-backed
# with no Redis. It is a separate service because background work must survive a redeploy of
# the web process, and because a job that ran inside a request would make a job's failure a
# `500`. It sits on the `data` network alone: it reaches the database, and nothing reaches it.
#
#   POSTGRES_PASSWORD=... docker compose up -d
#
# The database the stack brings up is **empty**: the containers are healthy, `/api/v1/health`
# answers, and every other route refuses for want of tables. The application is installed into
# it by its own command — run once, against the backend's image, from this directory:
#
#   POSTGRES_PASSWORD=... docker compose up -d --wait
#   docker compose run --rm backend python -m app.bootstrap \
#       --company-code ACME --company-name "Acme Trading" --market philippines \
#       --fiscal-year-start-month 1 --admin-subject you@example.com
#
# It prints the company id, which is the `COMPANY_ID` the frontend is given below. Running it a
# second time for the same company is refused rather than half-applied; a second company in the
# same install is the same command with another code. `--market` decides the chart of accounts
# and the tax rules; `--fiscal-year-start-month` is required wherever the market's pack leaves
# the fiscal calendar open (plan §8), and the pack refuses to guess it.
#
# The applications are consumed as **images** (`BACKEND_IMAGE` / `FRONTEND_IMAGE`
# choose which), so bringing the stack up needs neither application repository
# checked out — only this file. The backend image serves two services: the API
# (`backend`) and the scheduled work (`worker`, a different command). For local
# builds use the development override:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Two networks, on purpose: the frontend reaches the backend over `edge`, and
# only the backend reaches the database over `data`. The frontend having no route
# to the database is a delivery rule (API-first), so it is enforced by the network
# rather than by convention.
name: erpv1

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erpv1}
      POSTGRES_USER: ${POSTGRES_USER:-erpv1}
      # No default: a stack must be given its password, not inherit one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    image: ${BACKEND_IMAGE:-erpv1-backend:local}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-erpv1}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erpv1}
    depends_on:
      # The backend waits for a database that answers, not merely one that started.
      db:
        condition: service_healthy
    networks: [data, edge]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    image: ${BACKEND_IMAGE:-erpv1-backend:local}
    # The same image, a different command: one container per service, one build per
    # application. `--check` is not the entrypoint — it is the health probe below.
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-erpv1}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erpv1}
      # §9's worker_concurrency, stated here so the deployment's setting is visible.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on:
      # The worker waits for a database that answers, exactly as the backend does.
      db:
        condition: service_healthy
    networks: [data]
    restart: unless-stopped
    healthcheck:
      # Reports the wired jobs and schedules, and fails when the queue's own tables are
      # missing (the migration environment installs them) — so a worker that would run
      # nothing is visible rather than merely running.
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    image: ${FRONTEND_IMAGE:-erpv1-frontend:local}
    environment:
      # Read at start, so one image runs against any backend without a rebuild.
      API_BASE_URL: http://backend:8000
      COMPANY_ID: ${COMPANY_ID:-}
      ACTOR: ${ACTOR:-shell}
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge]
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  # The frontend and the backend.
  edge:
  # The backend and the database — the frontend is not on it.
  data:

volumes:
  db-data:
